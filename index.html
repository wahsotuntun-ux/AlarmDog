<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pet Buddy</title>
    <link rel="icon" href="icon-192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap"
    />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.1/p5.min.js"></script>

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 32px 16px;
        box-sizing: border-box;
        background: #e6ecf5;
        color: #28332f;
        font-family: "Fredoka", Arial, sans-serif;
      }

      #app {
        width: 500px;
        max-width: 100%;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      #app canvas {
        display: block;
        border-radius: 18px;
        box-shadow: 0 12px 30px rgba(35, 42, 69, 0.25);
      }

      /* Alarm card. */
      .alarm-card {
        background: #ffffff;
        border-radius: 18px;
        padding: 20px 24px;
        box-shadow: 0 6px 18px rgba(35, 42, 69, 0.12);
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .alarm-card label {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #5d6a64;
      }

      .alarm-row {
        display: flex;
        gap: 12px;
      }

      .alarm-row input[type="time"] {
        flex: 1;
        min-width: 0;
        padding: 8px 14px;
        border: 2px solid #d5dde8;
        border-radius: 12px;
        background: #f7f9fc;
        color: #2b3352;
        font: 600 34px "Fredoka", Arial, sans-serif;
      }

      .alarm-row input[type="time"]:focus {
        outline: none;
        border-color: #397d6b;
      }

      .alarm-btn {
        padding: 0 24px;
        border: 0;
        border-radius: 12px;
        background: #397d6b;
        color: #ffffff;
        font: 600 18px "Fredoka", Arial, sans-serif;
        cursor: pointer;
        transition: background 0.2s, transform 0.1s;
      }

      .alarm-btn:hover {
        background: #2f6a5a;
      }

      .alarm-btn:active {
        transform: scale(0.96);
      }

      .alarm-btn:focus-visible {
        outline: 3px solid #9fd3c3;
        outline-offset: 2px;
      }

      .alarm-status {
        margin: 0;
        min-height: 1.4em;
        color: #397d6b;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script src="sketch.js"></script>
  </body>
</html>
